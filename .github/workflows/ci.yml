name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            crates/magpie-core -> target

      # `npm ci` trips over an optional wasm peer of Tailwind's oxide engine
      # (npm/cli lock-file bug); `npm install` resolves the same lock file.
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and frontend tests
        run: |
          npm run typecheck
          npm test -- --passWithNoTests

      - name: Core library tests
        working-directory: crates/magpie-core
        run: cargo test --locked

      - name: App crate tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build Windows installer
        run: npx tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: magpie-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Known vulnerabilities in Rust dependencies (RustSec advisory database).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies
        run: |
          cargo audit --file crates/magpie-core/Cargo.lock
          cargo audit --file src-tauri/Cargo.lock

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit npm dependencies (shipped code only)
        run: npm audit --omit=dev --audit-level=high
